name: expense tracker CI/CD

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_dispatch:


concurrency:
  group: expense-tracker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/jk-mern/expense-tracker-backend
  CONTAINER_NAME: expense-tracker-backend
  CONTAINER_PORT: '3500'

jobs:
  test_and_build:
    name: Run test and build
    runs-on: ubuntu-latest
    permissions:

      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      NODE_ENV: production
      PORT: 3500
      SUPABASE_URL: ${{secrets.SUPABASE_URL}}
      SUPABASE_SERVICE_ROLE_KEY: ${{secrets.SUPABASE_SERVICE_ROLE_KEY}}
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Nodejs
      uses: actions/setup-node@v6
      with:
        node-version: 22

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.9.2 --activate


    - name: Install dependencies
      run: yarn install --immutable

    - name: Run tests
      run: yarn test --run

    - name: Build application
      run: yarn build

  docker:
    name: build docker image
    runs-on: ubuntu-latest
    needs: test_and_build
    # if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push images
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: |
          ${{ env.IMAGE_NAME }}:latest
          ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy image to server
    runs-on: ubuntu-latest
    needs: docker
    # if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Nodejs
      uses: actions/setup-node@v6
      with:
        node-version: 22

    - name: Enable Corepack
      run: corepack enable

    - name: Install dependencies
      run: yarn install --immutable

    - name: Apply pending migrations to database
      run: yarn prisma:migrate:deploy
      env:
        DIRECT_URL: ${{ secrets.DIRECT_URL }}

    - name: Deploy over SSH
      uses: appleboy/ssh-action@v1.2.0
      env:
        GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        DIRECT_URL: ${{ secrets.DIRECT_URL }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        IMAGE_TAG: ${{ github.sha }}
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        envs: GHCR_USERNAME,GHCR_TOKEN,DATABASE_URL,DIRECT_URL,SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,IMAGE_NAME,IMAGE_TAG,CONTAINER_NAME,CONTAINER_PORT
        script: |
          
          APP_IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"
          docker login ghcr.io -u "${GHCR_USERNAME}" -p "${GHCR_TOKEN}" 
          docker pull "${APP_IMAGE}"

          docker stop "${CONTAINER_NAME}" || true
          docker rm "${CONTAINER_NAME}" || true

          docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              -p "${CONTAINER_PORT}:${CONTAINER_PORT}" \
              -e DATABASE_URL="${DATABASE_URL}" \
              -e DIRECT_URL="${DIRECT_URL}" \
              -e NODE_ENV=production \
              -e PORT="${CONTAINER_PORT}" \
              -e SUPABASE_URL="${SUPABASE_URL}" \
              -e SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY}" \
              "${APP_IMAGE}" 
